name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**', '*.png', '*.txt']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**', '*.png', '*.txt']

permissions:
  contents: read

jobs:
  test:
    name: Tests and configuration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8

      - name: Validate Python syntax
        run: python -m compileall -q src tests

      - name: Run linters
        run: |
          black --check src tests
          isort --check-only src tests
          flake8 src tests --max-line-length=100 --ignore=E203,W503,E501,E226

      - name: Validate configuration files
        run: |
          python -c "from src.utils import load_config; load_config('configs/data.yaml')"
          python -c "from src.utils import load_config; load_config('configs/features.yaml')"
          python -c "from src.utils import load_config; load_config('configs/training.yaml')"
          python -c "from src.utils import load_config; load_config('configs/decision.yaml')"
          python -c "from src.utils import load_config; load_config('configs/monitoring.yaml')"

      - name: Run tests
        run: python -m pytest tests --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: churn-prediction:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
